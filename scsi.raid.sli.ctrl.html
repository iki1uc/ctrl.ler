<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>SCSI.RAID.SLI.CTRL.HTML · INDEX</title>
<style>
*{box-sizing:border-box}html,body{background:#02060a;color:#c8d8e8;font:11px ui-monospace;height:100%}
header{border-bottom:1px solid #1a2432;background:#080c14;padding:10px 14px;display:flex;justify-content:space-between}
.badge{border:1px solid #ffd700;color:#ffd700;padding:3px 8px;font-weight:900}
.grid{display:grid;grid-template-columns:300px 1fr 320px;height:calc(100vh - 45px)}
.panel{border-right:1px solid #1a2432;padding:12px;overflow:auto}
.slot{width:72px;height:56px;border:1px solid #1a2432;background:#0e141c;margin:4px;padding:6px;cursor:pointer;display:inline-block;font-size:9px}
.slot.active{border-color:#ffd700;color:#ffd700;background:#1a2a1a;box-shadow:0 0 10px #ffd70044}
.bus{height:24px;background:#05080c;border:1px solid #1a2432;margin:10px 0;position:relative;overflow:hidden}
.dot{position:absolute;top:6px;width:8px;height:8px;border-radius:50%;background:#5fc8ff;animation:run 2s linear infinite}
@keyframes run{from{left:-10px}to{left:100%}}
.chip{width:80px;height:80px;border:1px solid #ffd700;background:#1a1a0a;display:flex;align-items:center;justify-content:center;font-weight:900;color:#ffd700}
.row{display:flex;justify-content:space-between;margin:6px 0}
.btn{padding:6px 10px;border:1px solid #1a2432;background:#141c28;color:#c8d8e8;cursor:pointer}
.btn.gold{border-color:#ffd700;color:#ffd700}
pre{background:#05080c;border:1px solid #1a2432;padding:8px;font-size:10px;overflow:auto}
</style>
</head>
<body>
<header><div><span class="badge">SCSI.RAID.SLI.CTRL.HTML</span> INDEX · 3→9→81→729→3 · mach mehr als Bruder</div><div id="hval">H 656/729</div></header>
<div class="grid">
<div class="panel">
<h3 style="color:#ffd700">RAM SLOTS · 12 · SCSI</h3><div id="slots"></div>
<div class="bus"><div class="dot"></div><div class="dot" style="animation-delay:.5s;background:#7ce0a8"></div><div class="dot" style="animation-delay:1s;background:#ffd700"></div></div>
<h3 style="color:#a888ff">RAID stripet C81</h3><div class="row"><span>strip</span><span id="stripVal">81</span></div><input id="strip" type="range" min="3" max="729" step="3" value="81">
<h3 style="color:#5fc8ff">SLI phi</h3><div class="row"><span>phi</span><span id="phiVal">1.618</span></div><input id="phi" type="range" min="1" max="2" step="0.001" value="1.618">
<h3 style="color:#ffd700">CTRL.LER nano→H</h3><input id="nano" type="range" min="0" max="1" step="0.01" value="0.9"><div class="row"><span>Q</span><span id="q">0.9</span></div><div class="chip" id="chip">H 656</div>
</div>
<div class="panel" style="background:#02060a"><h3>OUTPUT</h3><pre id="out"></pre></div>
<div class="panel"><h3>LOG</h3><div id="log" style="height:300px;background:#05080c;border:1px solid #1a2432;padding:6px;overflow:auto;font-size:10px"></div><button class="btn gold" style="width:100%;margin-top:6px" onclick="location.reload()">RESET</button></div>
</div>
<script>
const list=['ram.x','ram.y','ram.z','ram.h','ram.bio','ram.nano','ram.cpu','ram.gpu','ram.rom','ram.disk','rom.disk','ram.sys'];
let s={active:new Set(['ram.x','ram.y','ram.z','ram.cpu','ram.gpu','ram.h','ram.bio']),strip:81,phi:1.618,nano:0.9};
function log(m){const l=document.getElementById('log');l.innerHTML+='<div>'+new Date().toLocaleTimeString()+' '+m+'</div>';l.scrollTop=9999}
function draw(){
 const c=document.getElementById('slots');c.innerHTML='';list.forEach(x=>{
  const d=document.createElement('div');d.className='slot'+(s.active.has(x)?' active':'');d.textContent=x;d.onclick=()=>{s.active.has(x)?s.active.delete(x):s.active.add(x);draw();upd()};c.appendChild(d);
 });
 document.getElementById('chip').textContent='H '+Math.round((0.7*0.1+0.8*0.2+s.nano*0.4+0.6*0.3)*729);
 document.getElementById('hval').textContent='H '+Math.round((0.7*0.1+0.8*0.2+s.nano*0.4+0.6*0.3)*729)+'/729';
}
function upd(){
 const q=(0.7*0.1+0.8*0.2+s.nano*0.4+0.6*0.3).toFixed(3);
 document.getElementById('q').textContent=q;
 document.getElementById('out').textContent=JSON.stringify({h:Math.round(q*729),scsi:{bus:[...s.active],speed:'100%'},raid:{type:'stripet',disks:['ram.x','ram.y','ram.z'],strip:s.strip,pur:'html',bildungsschicht:'C81'},sli:{link:['ram.cpu','ram.gpu'],via:'cpu.ram',phi:s.phi,skaliert:true},bio:{nano:s.nano,quality:q},why:'3→9→81→729→3'},null,2);
}
document.getElementById('strip').oninput=e=>{s.strip=e.target.value;document.getElementById('stripVal').textContent=e.target.value;upd()};
document.getElementById('phi').oninput=e=>{s.phi=parseFloat(e.target.value);document.getElementById('phiVal').textContent=s.phi;upd()};
document.getElementById('nano').oninput=e=>{s.nano=parseFloat(e.target.value);draw();upd();log('nano '+s.nano+' → H '+Math.round((0.7*0.1+0.8*0.2+s.nano*0.4+0.6*0.3)*729))};
draw();upd();log('SCSI.RAID.SLI.CTRL.HTML INDEX ready · mehr als Bruder');
</script>
</body>
</html>
